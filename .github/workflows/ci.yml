name: Validate MascoMatch
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: "3.12", cache: pip, cache-dependency-path: apps/api/requirements.lock}
      - run: python -m pip install -r apps/api/requirements.lock
      - run: python -m pip install pip-audit && python -m pip_audit -r apps/api/requirements.lock
      - run: python -m pytest apps/api/tests -q -p no:cacheprovider
        env: {PYTHONPATH: apps/api, AI_ENABLED: "false", EMBEDDINGS_ENABLED: "false", MAIL_DELIVERY_MODE: disabled}
      - name: Validate standalone production Compose
        run: |
          python tools/production_init.py
          docker compose --env-file .env.production -f compose.production.yml --profile ai-local --profile setup --profile smoke --profile monitoring config --quiet
      - name: Test real PostgreSQL migrations without model downloads
        run: |
          docker build -t mascomatch-migration-check infrastructure/docker/postgres
          docker run -d --name migration-db -p 127.0.0.1:55432:5432 -e POSTGRES_USER=upgrade -e POSTGRES_PASSWORD=disposable-ci-only -e POSTGRES_DB=upgrade --health-cmd='pg_isready -U upgrade -d upgrade' --health-interval=2s --health-retries=30 mascomatch-migration-check
          for i in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' migration-db)" = healthy ]; then break; fi
            sleep 2
          done
          python -m pytest apps/api/tests/test_visual_migrations_integration.py apps/api/tests/test_analytics_postgres.py -q -p no:cacheprovider
        env:
          PYTHONPATH: apps/api
          RUN_VISUAL_MIGRATION_TESTS: "1"
          DISPOSABLE_STACK: mascomatch-ai-upgrade
          MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://upgrade:disposable-ci-only@127.0.0.1:55432/upgrade
          MAIL_DELIVERY_MODE: disabled
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  vision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - run: docker build -f apps/api/Dockerfile.worker -t mascomatch-vision-check apps/api
      - name: Audit installed CPU worker dependencies
        run: >-
          docker run --rm --user 0 mascomatch-vision-check sh -c
          'python -m pip freeze > /tmp/cpu-packages.txt &&
          sed "s/+cpu//" /tmp/cpu-packages.txt > /tmp/upstream-packages.txt &&
          pip install --quiet pip-audit &&
          python -m pip_audit --no-deps --disable-pip -r /tmp/upstream-packages.txt'
