# Standalone definition: never merge development's public service ports or source mounts.
x-backend: &backend
  APP_ENV: production
  ANALYTICS_ENABLED: ${ANALYTICS_ENABLED:-true}
  RATE_LIMIT_ANALYTICS: ${RATE_LIMIT_ANALYTICS:-120}
  RATE_LIMIT_ANALYTICS_DAILY: ${RATE_LIMIT_ANALYTICS_DAILY:-200000}
  ANALYTICS_VISITOR_DAYS: ${ANALYTICS_VISITOR_DAYS:-180}
  ANALYTICS_SESSION_MINUTES: ${ANALYTICS_SESSION_MINUTES:-30}
  ANALYTICS_RAW_DAYS: ${ANALYTICS_RAW_DAYS:-90}
  ANALYTICS_DAILY_DAYS: ${ANALYTICS_DAILY_DAYS:-730}
  DATABASE_URL_FILE: /run/secrets/database_url
  JWT_SECRET_FILE: /run/secrets/jwt_secret
  REDIS_URL_FILE: /run/secrets/redis_url
  S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
  SMTP_PASSWORD_FILE: /run/secrets/smtp_password
  METRICS_TOKEN_FILE: /run/secrets/metrics_token
  WEB_ORIGIN: ${WEB_ORIGIN:?Run tools/production_init.py first}
  PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?Set the public HTTPS URL}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set explicit allowed hosts}
  TRUSTED_PROXY_IPS: 172.30.50.2,172.30.50.3
  RATE_LIMIT_BACKEND: redis
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REGISTER: ${RATE_LIMIT_REGISTER:-5}
  RATE_LIMIT_CONTACT: ${RATE_LIMIT_CONTACT:-5}
  RATE_LIMIT_CONTACT_DAILY: ${RATE_LIMIT_CONTACT_DAILY:-50}
  S3_ENDPOINT: http://photos:8333
  S3_PUBLIC_ENDPOINT: http://photos:8333
  S3_BUCKET: pet-photos
  S3_ACCESS_KEY: mascomatch_app
  OLLAMA_BASE_URL: http://ollama:11434
  AI_ENABLED: ${AI_ENABLED:-false}
  EMBEDDINGS_ENABLED: ${EMBEDDINGS_ENABLED:-false}
  EMBEDDING_CACHE_DIR: /models/clip
  PET_REID_CACHE_DIR: /models/pet-reid
  DETECTOR_CACHE_DIR: /models/detector
  PET_REID_ENABLED: ${PET_REID_ENABLED:-true}
  OPENCLIP_ENABLED: ${OPENCLIP_ENABLED:-true}
  PET_CROP_ENABLED: ${PET_CROP_ENABLED:-true}
  PET_CROP_CONFIDENCE: ${PET_CROP_CONFIDENCE:-0.75}
  PET_CROP_MARGIN: ${PET_CROP_MARGIN:-0.18}
  PET_CROP_TIMEOUT_SECONDS: ${PET_CROP_TIMEOUT_SECONDS:-15}
  EMBEDDING_REQUEST_TIMEOUT_SECONDS: ${EMBEDDING_REQUEST_TIMEOUT_SECONDS:-90}
  EMBEDDING_CPU_THREADS: ${EMBEDDING_CPU_THREADS:-2}
  AI_TEXT_MODEL: gemma3:4b
  AI_VISION_MODEL: gemma3:4b
  OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-4096}
  OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-768}
  OLLAMA_NUM_THREADS: ${OLLAMA_NUM_THREADS:-3}
  OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-15m}
  OLLAMA_PREWARM: ${OLLAMA_PREWARM:-true}
  AI_TEXT_REQUEST_TIMEOUT_SECONDS: ${AI_TEXT_REQUEST_TIMEOUT_SECONDS:-120}
  AI_VISION_REQUEST_TIMEOUT_SECONDS: ${AI_VISION_REQUEST_TIMEOUT_SECONDS:-240}
  VLM_IMAGE_MAX_SIDE: ${VLM_IMAGE_MAX_SIDE:-1024}
  VLM_IMAGE_JPEG_QUALITY: ${VLM_IMAGE_JPEG_QUALITY:-88}
  OLLAMA_CAPABILITIES_CACHE_SECONDS: ${OLLAMA_CAPABILITIES_CACHE_SECONDS:-3600}
  OPENCLIP_VISUAL_FLOOR: ${OPENCLIP_VISUAL_FLOOR:-0.55}
  OPENCLIP_VISUAL_CEILING: ${OPENCLIP_VISUAL_CEILING:-0.95}
  PET_REID_VISUAL_FLOOR: ${PET_REID_VISUAL_FLOOR:-0.50}
  PET_REID_VISUAL_CEILING: ${PET_REID_VISUAL_CEILING:-0.90}
  VISUAL_BEST_WEIGHT: ${VISUAL_BEST_WEIGHT:-0.7}
  MATCHING_ANALYSIS_WAIT_SECONDS: ${MATCHING_ANALYSIS_WAIT_SECONDS:-30}
  MATCHING_NOTIFY_MIN_COVERAGE: ${MATCHING_NOTIFY_MIN_COVERAGE:-0.35}
  MATCHING_NOTIFY_MIN_FEATURE: ${MATCHING_NOTIFY_MIN_FEATURE:-0.65}
  MATCHING_NOTIFY_MIN_GEO: ${MATCHING_NOTIFY_MIN_GEO:-0.35}
  MATCHING_NOTIFY_THRESHOLD: ${MATCHING_NOTIFY_THRESHOLD:-0.82}
  MAIL_DELIVERY_MODE: ${MAIL_DELIVERY_MODE:-disabled}
  PHOTO_REMINDER_DELAY_MINUTES: ${PHOTO_REMINDER_DELAY_MINUTES:-30}
  SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_FROM: ${SMTP_FROM:-MascoMatch <avisos@mascomatch.com>}
  SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}

x-backend-secrets: &backend-secrets
  [database_url, jwt_secret, redis_url, s3_secret_key, smtp_password, metrics_token]

x-safety: &safety
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  db:
    build: {context: ./infrastructure/docker/postgres}
    restart: unless-stopped
    mem_limit: ${DATABASE_MEMORY_LIMIT:-2g}
    cpus: 1.5
    environment:
      POSTGRES_DB: mascomatch
      POSTGRES_USER: mascomatch_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner_password
    secrets: [db_owner_password]
    volumes: [postgres_data:/var/lib/postgresql/data, ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U mascomatch_owner -d mascomatch"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}

  redis:
    <<: *safety
    image: redis:7-alpine
    user: redis
    mem_limit: 512m
    cpus: 0.5
    command: [redis-server, /run/secrets/redis_config]
    secrets: [redis_config, redis_password]
    volumes: [redis_data:/data]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH=$$(tr -d "\r\n" </run/secrets/redis_password) redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  photos:
    <<: *safety
    image: chrislusf/seaweedfs:4.48
    mem_limit: ${STORAGE_MEMORY_LIMIT:-1g}
    cpus: 1
    cap_add: [CHOWN, SETUID, SETGID]
    command: server -dir=/data -ip=photos -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -volume.max=16 -s3 -s3.port=8333 -s3.config=/run/secrets/photos_config -s3.concurrentUploadLimitMB=128
    secrets: [photos_config]
    volumes: [photos_data:/data]
    networks: [backend]

  photos-init:
    build: {context: ./apps/api}
    environment:
      <<: *backend
      RUNTIME_ROLE: ops
      JWT_SECRET_FILE: ""
      METRICS_TOKEN_FILE: ""
      SMTP_PASSWORD_FILE: ""
      MAIL_DELIVERY_MODE: disabled
      S3_ACCESS_KEY: mascomatch_admin
      S3_SECRET_KEY_FILE: /run/secrets/photos_admin_secret
    secrets: [database_url, redis_url, photos_admin_secret]
    command: python -m app.ops.photos
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    depends_on: {photos: {condition: service_started}}

  migrate:
    build: {context: ./apps/api}
    environment:
      <<: *backend
      DATABASE_URL_FILE: /run/secrets/migrator_database_url
      RUNTIME_ROLE: migrate
      JWT_SECRET_FILE: ""
      S3_SECRET_KEY_FILE: ""
      SMTP_PASSWORD_FILE: ""
      METRICS_TOKEN_FILE: ""
      MAIL_DELIVERY_MODE: disabled
    secrets: [migrator_database_url, app_db_password, redis_url]
    command: sh -c "python -m app.ops.database prepare && alembic upgrade head && python -m app.ops.database permissions"
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}

  api:
    <<: *safety
    build: {context: ./apps/api}
    environment: *backend
    secrets: *backend-secrets
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --no-proxy-headers --no-access-log
    read_only: true
    tmpfs: ["/tmp:size=268435456,mode=1777"]
    volumes: [vision_models:/models:ro]
    networks: [backend, edge]
    mem_limit: 768m
    cpus: 1
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready',timeout=6)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
    depends_on: {migrate: {condition: service_completed_successfully}, photos-init: {condition: service_completed_successfully}}

  web:
    <<: *safety
    build: {context: ./apps/web, args: {NEXT_PUBLIC_SEARCH_COUNTRY: "${NEXT_PUBLIC_SEARCH_COUNTRY:-UY}"}}
    environment:
      API_INTERNAL_URL: http://api:8000/api/v1
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
      TRUST_PROXY_HEADERS: "true"
      GEOCODER_BASE_URL: ${GEOCODER_BASE_URL:-https://photon.komoot.io}
    read_only: true
    tmpfs: [/tmp]
    networks:
      edge: {ipv4_address: 172.30.50.3}
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on: {api: {condition: service_healthy}}

  caddy:
    <<: *safety
    image: caddy:2.11.7-alpine
    mem_limit: 256m
    cpus: 0.5
    cap_add: [NET_BIND_SERVICE]
    environment: {SITE_DOMAIN: "${SITE_DOMAIN:?Set the purchased domain}"}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: [./infrastructure/production/Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
    networks:
      edge: {ipv4_address: 172.30.50.2}
    depends_on: {web: {condition: service_healthy}}

  ollama:
    <<: *safety
    image: ollama/ollama:0.35.1
    profiles: [ai-local]
    environment: {OLLAMA_NO_CLOUD: "1", OLLAMA_NUM_PARALLEL: "1", OLLAMA_MAX_LOADED_MODELS: "1"}
    volumes: [ollama_models:/root/.ollama]
    networks: [backend]
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-10g}
    cpus: 3.5
    healthcheck:
      test: [CMD, ollama, list]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    <<: *safety
    build: {context: ./apps/api, dockerfile: Dockerfile.worker}
    profiles: [ai-local]
    environment: &worker-environment
      <<: *backend
      RUNTIME_ROLE: worker
      ANALYSIS_WORKER_KIND: visual
      JWT_SECRET_FILE: ""
      METRICS_TOKEN_FILE: ""
      SMTP_PASSWORD_FILE: ""
      MAIL_DELIVERY_MODE: disabled
      S3_ACCESS_KEY: mascomatch_vision
      S3_SECRET_KEY_FILE: /run/secrets/vision_s3_secret
    secrets: [database_url, redis_url, vision_s3_secret]
    read_only: true
    tmpfs: ["/tmp:size=536870912,mode=1777"]
    volumes: [vision_models:/models:ro]
    networks: [backend]
    mem_limit: ${VISUAL_WORKER_MEMORY_LIMIT:-4g}
    cpus: 2
    depends_on: {api: {condition: service_healthy}, ollama: {condition: service_started}}
    healthcheck:
      test: [CMD, python, -m, app.ops.ai_health, --worker, visual]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  model-setup:
    build: {context: ./apps/api, dockerfile: Dockerfile.worker}
    profiles: [setup]
    user: "0:0"
    environment:
      APP_ENV: test
      PET_REID_ENABLED: ${PET_REID_ENABLED:-true}
      OPENCLIP_ENABLED: ${OPENCLIP_ENABLED:-true}
      PET_CROP_ENABLED: ${PET_CROP_ENABLED:-true}
      EMBEDDING_CPU_THREADS: "2"
    command: python -m app.embeddings.setup
    read_only: true
    tmpfs: [/tmp]
    volumes: [vision_models:/models:rw, ollama_models:/ollama:rw]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 4g
    cpus: 2

  ai-smoke:
    build: {context: ./apps/api, dockerfile: Dockerfile.worker}
    profiles: [smoke]
    environment:
      <<: *backend
      RUNTIME_ROLE: ops
      DATABASE_URL_FILE: /run/secrets/migrator_database_url
      JWT_SECRET_FILE: ""
      METRICS_TOKEN_FILE: ""
      SMTP_PASSWORD_FILE: ""
      MAIL_DELIVERY_MODE: disabled
    secrets: [migrator_database_url, redis_url, s3_secret_key]
    command: python -m app.ops.ai_smoke --allow-disposable-database --download-fixtures
    read_only: true
    tmpfs: ["/tmp:size=268435456,mode=1777"]
    volumes: [vision_models:/models:ro]
    networks: [backend]
    mem_limit: 4g
    cpus: 2

  worker-ai:
    <<: *safety
    build: {context: ./apps/api, dockerfile: Dockerfile.worker}
    profiles: [ai-local]
    environment:
      <<: *worker-environment
      ANALYSIS_WORKER_KIND: semantic
      EMBEDDING_CPU_THREADS: "1"
    secrets: [database_url, redis_url, vision_s3_secret]
    read_only: true
    tmpfs: ["/tmp:size=268435456,mode=1777"]
    volumes: [vision_models:/models:ro]
    networks: [backend]
    mem_limit: 1536m
    cpus: 0.5
    depends_on: {api: {condition: service_healthy}, ollama: {condition: service_healthy}}
    healthcheck:
      test: [CMD, python, -m, app.ops.ai_health, --worker, semantic]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s

  backup:
    <<: *safety
    build: {context: ./apps/api, dockerfile: Dockerfile.ops}
    mem_limit: ${BACKUP_MEMORY_LIMIT:-3g}
    cpus: 1
    environment:
      <<: *backend
      BACKUP_KEY_FILE: /run/secrets/backup_key
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}
      BACKUP_LOCAL_KEEP: ${BACKUP_LOCAL_KEEP:-14}
      OFFSITE_BACKUP_ENABLED: ${OFFSITE_BACKUP_ENABLED:-false}
      OFFSITE_RETRY_INTERVAL_SECONDS: ${OFFSITE_RETRY_INTERVAL_SECONDS:-900}
      OFFSITE_DEEP_VERIFY_INTERVAL_SECONDS: ${OFFSITE_DEEP_VERIFY_INTERVAL_SECONDS:-604800}
      B2_ENDPOINT: ${B2_ENDPOINT:-}
      B2_REGION: ${B2_REGION:-}
      B2_BUCKET: ${B2_BUCKET:-}
      B2_KEY_ID_FILE: /run/secrets/b2_key_id
      B2_APPLICATION_KEY_FILE: /run/secrets/b2_application_key
      B2_OBJECT_LOCK_ENABLED: ${B2_OBJECT_LOCK_ENABLED:-true}
      B2_OBJECT_LOCK_DAYS: ${B2_OBJECT_LOCK_DAYS:-30}
      B2_OPERATION_TIMEOUT_SECONDS: ${B2_OPERATION_TIMEOUT_SECONDS:-900}
      RUNTIME_ROLE: ops
      JWT_SECRET_FILE: ""
      SMTP_PASSWORD_FILE: ""
      METRICS_TOKEN_FILE: ""
      MAIL_DELIVERY_MODE: disabled
    secrets: [database_url, redis_url, s3_secret_key, backup_key, b2_key_id, b2_application_key]
    volumes: [backups:/backups]
    networks: [backend]
    read_only: true
    tmpfs: ["/tmp:size=2147483648,mode=1777"]
    command: python -m app.ops.backup serve /backups
    depends_on: {api: {condition: service_healthy}}

  prometheus:
    <<: *safety
    image: prom/prometheus:v3.15.0
    mem_limit: 512m
    cpus: 0.5
    profiles: [monitoring]
    secrets: [metrics_token]
    volumes: [./infrastructure/production/prometheus.yml:/etc/prometheus/prometheus.yml:ro, ./infrastructure/production/alerts.yml:/etc/prometheus/alerts.yml:ro, prometheus_data:/prometheus]
    ports: ["127.0.0.1:9090:9090"]
    networks: [backend]

networks:
  backend:
  edge:
    ipam: {config: [{subnet: 172.30.50.0/24, ip_range: 172.30.50.128/25}]}

volumes:
  postgres_data:
  redis_data:
  photos_data:
  vision_models:
  ollama_models:
  caddy_data:
  caddy_config:
  backups:
  prometheus_data:

secrets:
  database_url: {file: "${SECRETS_DIR:-./.secrets}/database_url"}
  migrator_database_url: {file: "${SECRETS_DIR:-./.secrets}/migrator_database_url"}
  db_owner_password: {file: "${SECRETS_DIR:-./.secrets}/db_owner_password"}
  app_db_password: {file: "${SECRETS_DIR:-./.secrets}/app_db_password"}
  jwt_secret: {file: "${SECRETS_DIR:-./.secrets}/jwt_secret"}
  redis_url: {file: "${SECRETS_DIR:-./.secrets}/redis_url"}
  redis_password: {file: "${SECRETS_DIR:-./.secrets}/redis_password"}
  redis_config: {file: "${SECRETS_DIR:-./.secrets}/redis_config"}
  photos_admin_secret: {file: "${SECRETS_DIR:-./.secrets}/photos_admin_secret"}
  photos_config: {file: "${SECRETS_DIR:-./.secrets}/photos_config"}
  vision_s3_secret: {file: "${SECRETS_DIR:-./.secrets}/vision_s3_secret"}
  s3_secret_key: {file: "${SECRETS_DIR:-./.secrets}/s3_secret_key"}
  smtp_password: {file: "${SECRETS_DIR:-./.secrets}/smtp_password"}
  metrics_token: {file: "${SECRETS_DIR:-./.secrets}/metrics_token"}
  backup_key: {file: "${SECRETS_DIR:-./.secrets}/backup_key"}
  b2_key_id: {file: "${SECRETS_DIR:-./.secrets}/b2_key_id"}
  b2_application_key: {file: "${SECRETS_DIR:-./.secrets}/b2_application_key"}
