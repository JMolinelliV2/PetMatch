services:
  db:
    build:
      context: ./infrastructure/docker/postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mascomatch}
      POSTGRES_USER: ${POSTGRES_USER:-mascomatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    build:
      context: ./infrastructure/docker/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mascomatch}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ./apps/api
    working_dir: /app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app"
    environment: &backend_environment
      WATCHFILES_FORCE_POLLING: "true"
      ANALYTICS_ENABLED: ${ANALYTICS_ENABLED:-true}
      RATE_LIMIT_ANALYTICS: ${RATE_LIMIT_ANALYTICS:-120}
      RATE_LIMIT_ANALYTICS_DAILY: ${RATE_LIMIT_ANALYTICS_DAILY:-200000}
      ANALYTICS_VISITOR_DAYS: ${ANALYTICS_VISITOR_DAYS:-180}
      ANALYTICS_SESSION_MINUTES: ${ANALYTICS_SESSION_MINUTES:-30}
      ANALYTICS_RAW_DAYS: ${ANALYTICS_RAW_DAYS:-90}
      ANALYTICS_DAILY_DAYS: ${ANALYTICS_DAILY_DAYS:-730}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mascomatch:change-me-locally@db:5432/mascomatch}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-pet-photos}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-mascomatch}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-this-minio-password}
      MAX_PHOTO_SIZE_BYTES: ${MAX_PHOTO_SIZE_BYTES:-10485760}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ollama
      AI_TEXT_MODEL: ${AI_TEXT_MODEL:-gemma3:4b}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-gemma3:4b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-180}
      AI_MAX_ATTEMPTS: ${AI_MAX_ATTEMPTS:-3}
      AI_DISPATCH_INTERVAL_SECONDS: ${AI_DISPATCH_INTERVAL_SECONDS:-5}
      LINKED_MATCH_THRESHOLD: ${LINKED_MATCH_THRESHOLD:-0.75}
      LINKED_FEATURE_CONFIDENCE: ${LINKED_FEATURE_CONFIDENCE:-0.7}
      MAIL_DELIVERY_MODE: ${MAIL_DELIVERY_MODE:-disabled}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-MascoMatch <avisos@mascomatch.local>}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
      PHOTO_REMINDER_DELAY_MINUTES: ${PHOTO_REMINDER_DELAY_MINUTES:-30}
      EMBEDDINGS_ENABLED: ${EMBEDDINGS_ENABLED:-false}
      EMBEDDING_CACHE_DIR: /models/clip
      PET_REID_CACHE_DIR: /models/pet-reid
      DETECTOR_CACHE_DIR: /models/detector
      PET_REID_ENABLED: ${PET_REID_ENABLED:-true}
      OPENCLIP_ENABLED: ${OPENCLIP_ENABLED:-true}
      PET_CROP_ENABLED: ${PET_CROP_ENABLED:-true}
      PET_CROP_CONFIDENCE: ${PET_CROP_CONFIDENCE:-0.75}
      PET_CROP_MARGIN: ${PET_CROP_MARGIN:-0.18}
      PET_CROP_TIMEOUT_SECONDS: ${PET_CROP_TIMEOUT_SECONDS:-15}
      EMBEDDING_REQUEST_TIMEOUT_SECONDS: ${EMBEDDING_REQUEST_TIMEOUT_SECONDS:-90}
      OPENCLIP_VISUAL_FLOOR: ${OPENCLIP_VISUAL_FLOOR:-0.55}
      OPENCLIP_VISUAL_CEILING: ${OPENCLIP_VISUAL_CEILING:-0.95}
      PET_REID_VISUAL_FLOOR: ${PET_REID_VISUAL_FLOOR:-0.50}
      PET_REID_VISUAL_CEILING: ${PET_REID_VISUAL_CEILING:-0.90}
      VISUAL_BEST_WEIGHT: ${VISUAL_BEST_WEIGHT:-0.7}
      MATCHING_ANALYSIS_WAIT_SECONDS: ${MATCHING_ANALYSIS_WAIT_SECONDS:-30}
      MATCHING_NOTIFY_MIN_COVERAGE: ${MATCHING_NOTIFY_MIN_COVERAGE:-0.35}
      MATCHING_NOTIFY_MIN_FEATURE: ${MATCHING_NOTIFY_MIN_FEATURE:-0.65}
      MATCHING_NOTIFY_MIN_GEO: ${MATCHING_NOTIFY_MIN_GEO:-0.35}
      OLLAMA_CAPABILITIES_CACHE_SECONDS: ${OLLAMA_CAPABILITIES_CACHE_SECONDS:-3600}
      VLM_IMAGE_JPEG_QUALITY: ${VLM_IMAGE_JPEG_QUALITY:-88}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-4096}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-768}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-15m}
      OLLAMA_PREWARM: ${OLLAMA_PREWARM:-true}
      OLLAMA_NUM_THREADS: ${OLLAMA_NUM_THREADS:-3}
      AI_TEXT_REQUEST_TIMEOUT_SECONDS: ${AI_TEXT_REQUEST_TIMEOUT_SECONDS:-120}
      AI_VISION_REQUEST_TIMEOUT_SECONDS: ${AI_VISION_REQUEST_TIMEOUT_SECONDS:-240}
      VLM_IMAGE_MAX_SIDE: ${VLM_IMAGE_MAX_SIDE:-1024}
      EMBEDDING_CPU_THREADS: ${EMBEDDING_CPU_THREADS:-2}
      MATCHING_CANDIDATE_THRESHOLD: ${MATCHING_CANDIDATE_THRESHOLD:-0.55}
      MATCHING_NOTIFY_THRESHOLD: ${MATCHING_NOTIFY_THRESHOLD:-0.82}
      MATCHING_MAX_RADIUS_METERS: ${MATCHING_MAX_RADIUS_METERS:-50000}
      MATCHING_TEMPORAL_DAYS: ${MATCHING_TEMPORAL_DAYS:-30}
      MATCHING_VISUAL_FLOOR: ${MATCHING_VISUAL_FLOOR:-0.55}
      MATCHING_VISUAL_CEILING: ${MATCHING_VISUAL_CEILING:-0.95}
      MAIL_GROUP_SECONDS: ${MAIL_GROUP_SECONDS:-15}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-30}
      RATE_LIMIT_REGISTER: ${RATE_LIMIT_REGISTER:-5}
      RATE_LIMIT_CONTACT: ${RATE_LIMIT_CONTACT:-5}
      RATE_LIMIT_CONTACT_DAILY: ${RATE_LIMIT_CONTACT_DAILY:-50}
      RATE_LIMIT_PUBLISH: ${RATE_LIMIT_PUBLISH:-60}
      RATE_LIMIT_READ: ${RATE_LIMIT_READ:-300}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - ./test-data:/app/test-data:ro
      - vision_models:/models:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  ollama:
    image: ollama/ollama:0.35.1
    profiles: [ai-local]
    restart: unless-stopped
    environment:
      OLLAMA_NO_CLOUD: "1"
      SSL_CERT_DIR: /etc/ssl/certs:/root/.ollama/certificates
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama_models:/root/.ollama

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.worker
    profiles: [ai-local]
    working_dir: /app
    command: python -m app.analysis.worker
    restart: unless-stopped
    environment:
      <<: *backend_environment
      ANALYSIS_WORKER_KIND: visual
    volumes:
      - ./apps/api:/app
      - vision_models:/models
      - ./test-data:/app/test-data:ro
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
      ollama:
        condition: service_started

  worker-ai:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.worker
    profiles: [ai-local]
    command: python -m app.analysis.worker
    restart: unless-stopped
    environment:
      <<: *backend_environment
      ANALYSIS_WORKER_KIND: semantic
      EMBEDDING_CPU_THREADS: "1"
    volumes:
      - ./apps/api:/app
      - vision_models:/models
      - ./test-data:/app/test-data:ro
    depends_on:
      api: {condition: service_started}
      redis: {condition: service_healthy}
      ollama: {condition: service_started}

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --webpack"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      # Docker Desktop/OneDrive can miss filesystem notifications from the host.
      WATCHPACK_POLLING: "1000"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000/api/v1}
      GEOCODER_BASE_URL: ${GEOCODER_BASE_URL:-https://photon.komoot.io}
      NEXT_PUBLIC_SEARCH_COUNTRY: ${NEXT_PUBLIC_SEARCH_COUNTRY:-UY}
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

  mailpit:
    image: axllent/mailpit:v1.27.4
    profiles: [mail-local]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: "1000"
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data

volumes:
  postgres_data:
  minio_data:
  web_node_modules:
  ollama_models:
  mailpit_data:
  vision_models:

